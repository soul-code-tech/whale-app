<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>🐋 Whale Radar — сделки китов Hyperliquid</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e11;--card:#151a21;--line:#232a33;--txt:#e8edf2;--dim:#8b97a5;--up:#26a69a;--dn:#ef5350;--acc:#4da3ff;--gold:#f0b429}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding-bottom:76px}
header{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
header h1{font-size:17px}
#fg{color:var(--dim);font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 10px}
.wrap{padding:0 10px}
#aiCard{background:linear-gradient(135deg,#1a2130,#151a21);border:1px solid #2b3547;border-radius:10px;padding:10px 12px;margin:8px 0;display:none}
#aiCard .t{font-weight:700;font-size:13px;margin-bottom:4px;color:var(--gold)}
#aiCard .x{font-size:13px;line-height:1.5}
#aiCard .d{color:var(--dim);font-size:11px;margin-top:6px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
#chart{height:min(44vh,420px);min-height:230px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:2px}
h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 8px}
.twrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.twrap table{min-width:100%}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:8px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:10.5px;text-transform:uppercase}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.L{background:rgba(38,166,154,.15);color:var(--up)}.S{background:rgba(239,83,80,.15);color:var(--dn)}
.pos{color:var(--up)}.neg{color:var(--dn)}.dim{color:var(--dim)}
.cta{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:rgba(11,14,17,.94);border-top:1px solid var(--line)}
.cta a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;padding:11px 6px;border-radius:10px}
.a1{background:linear-gradient(135deg,#2b6cff,#4da3ff);color:#fff}
.a2{background:linear-gradient(135deg,#c98a1b,#f0b429);color:#221a02}
#status{color:var(--dim);font-size:12px;padding:10px 4px;text-align:center;min-height:20px}
.kselect{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:14px;width:100%;margin:6px 0}
.wrbadge{font-size:11px;color:var(--dim)}
@media (max-width:430px){
  td,th{padding:6px 6px;font-size:12px}
  header h1{font-size:15px}
  .cta a{font-size:12.5px;padding:12px 4px}
  #aiCard .x{font-size:12.5px}
}
</style>
</head>
<body>
<header><h1>🐋 Whale Radar</h1><span id="fg">🌡 …</span></header>
<div class="wrap">
  <div id="aiCard"><div class="t" id="aiT"></div><div class="x" id="aiX"></div><div class="d" id="aiD"></div></div>
  <select id="kit" class="kselect" onchange="pickKit(this.value)"></select>
  <div id="coins" class="pills"></div>
  <div id="tfs" class="pills"></div>
  <div id="chart"></div>
  <p id="status"></p>
  <h2>Позиции кита — вход · стоп · плечо · PnL</h2>
  <div class="twrap"><table id="posT"><tbody><tr><td class="dim">Загружаю…</td></tr></tbody></table></div>
  <h2>Сделки кита — вход · долив · тейк · стоп</h2>
  <div class="twrap"><table id="trT"><tbody><tr><td class="dim">—</td></tr></tbody></table></div>
</div>
<div class="cta">
  <a class="a1" id="obA" href="#" target="_blank">🤖 Копи-трейдинг</a>
  <a class="a2" id="refA" href="#" target="_blank">💎 Бонус BingX</a>
</div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setBackgroundColor('#0b0e11'); } catch(e){} }

// ==== настройки ====
const DEFAULT_REF = "https://bingx.com/invite/UKFNVC";
const DEFAULT_OB  = "https://general.bingx.com/2H4CTy";
const WALLETS_JSON = "wallets.json";
const CONTENT_JSON = "content.json";
const MIN_WR = 70;   // показывать китов с винрейтом от 70% (переключатель ниже)
// ===================

const qs  = new URLSearchParams(location.search);
const REF = qs.get('ref') || DEFAULT_REF;
const OB  = qs.get('ob')  || DEFAULT_OB;
document.getElementById('obA').href  = OB;
document.getElementById('refA').href = REF;

const HL = 'https://api.hyperliquid.xyz/info';
async function hl(p){
  const r = await fetch(HL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}

// ==== кошельки: URL → wallets.json (обновляет бот) ====
let WALLETS = [], ALL_WALLETS = [];
let currentKit = null;

// мусорные тикеры Hyperliquid (@107 и просто цифры) не показываем
const junkCoin = c => /^@/.test(c) || /^\d+$/.test(c);

async function loadWallets(){
  const qsW = (qs.get('w')||'').split(',').filter(a=>/^0x[0-9a-fA-F]{40}$/.test(a)).slice(0,25);
  if (qsW.length) { ALL_WALLETS = qsW.map(a=>({addr:a.toLowerCase(), name:'Кит '+a.slice(2,6)+'…'})); return }
  try {
    const r = await fetch(WALLETS_JSON + '?t=' + Date.now());
    if (r.ok) {
      const d = await r.json();
      if (Array.isArray(d) && d.length)
        ALL_WALLETS = d.filter(w=>w.addr).map(w=>({addr:w.addr.toLowerCase(),
            name:w.name||('Кит '+w.addr.slice(2,6)+'…'), wr:w.wr, n:w.n, pnl:w.pnl, active:w.active}));
    }
  } catch(e){}
}

function applyWalletFilter(){
  // только активные киты с винрейтом от 70% — по умолчанию, без переключателя
  let list = ALL_WALLETS.filter(w=>w.active !== false)
                        .filter(w=>(w.wr === undefined) || (w.wr >= MIN_WR));
  if (!list.length) list = ALL_WALLETS;   // пусто не оставляем
  WALLETS = list;
  if (currentKit !== null && !WALLETS[currentKit]) currentKit = 0;
}

function renderKitSelect(){
  const el = document.getElementById('kit');
  el.innerHTML = '';
  if (!WALLETS.length) { el.innerHTML = '<option>Нет кошельков — открой из сигнала канала</option>'; return }
  WALLETS.forEach((w,i)=>{
    const o = document.createElement('option');
    o.value = i;
    let meta = '';
    if (w.wr !== undefined) meta = ` — WR ${w.wr}%${w.pnl!==undefined && w.pnl>0 ? ' · +'+fmtUsd(w.pnl):''}`;
    o.textContent = '🐋 ' + w.name + meta;
    if (currentKit===i) o.selected = true;
    el.appendChild(o);
  });
}

function pickKit(i){ currentKit = +i; loadAll(); }

let fills = [], poss = [], coin = null, tf = '1h', chart = null, series = null;

const fmtUsd = v => { v=+v||0; const a=Math.abs(v);
  if (a>=1e9) return (v/1e9).toFixed(2)+'B$';
  if (a>=1e6) return (v/1e6).toFixed(2)+'M$';
  if (a>=1e3) return (v/1e3).toFixed(1)+'K$';
  return v.toFixed(0)+'$'; };
const fmtPx = p => { p=+p;
  if (p>=1000)  return String(Math.round(p)).replace(/\B(?=(\d{3})+(?!\d))/g," ");
  if (p>=1)     return p.toFixed(4);
  if (p>=0.001) return p.toFixed(6);
  return p ? p.toPrecision(4) : '0'; };
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const when = t => new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const isLong = d => /Long/i.test(d||'');
const isOpen = d => /^Open/i.test(d||'');

function setStat(s){ document.getElementById('status').textContent = s || ''; }

// ==== индекс страха и жадности ====
const FG_EMOJI = v => v<25?'😱':v<45?'😨':v<55?'⚖️':v<75?'😏':'🤑';
const FG_NAME  = v => v<25?'паника':v<45?'страх':v<55?'нейтрально':v<75?'жадность':'эйфория';
function setFG(v, name){
  document.getElementById('fg').textContent = `🌡 ${FG_EMOJI(v)} ${v} · ${name || FG_NAME(v)}`;
}
async function loadFG(){
  try {
    const r = await fetch('https://api.alternative.me/fng/?limit=1');
    if (!r.ok) return;
    const d = (await r.json()).data[0];
    setFG(+d.value);
  } catch(e){}
  // прямой запрос не дошёл — останется запасное значение из content.json
}

// ==== AI-инсайт дня (content.json обновляет бот) ====
async function loadInsight(){
  try {
    const r = await fetch(CONTENT_JSON + '?t=' + Date.now());
    if (!r.ok) return;
    const d = await r.json();
    if (!d || !d.text) return;
    document.getElementById('aiT').textContent = '🧠 ' + (d.title || 'Инсайт дня');
    document.getElementById('aiX').textContent = d.text;
    document.getElementById('aiD').textContent = 'по данным рынка · ' + (d.date || '');
    document.getElementById('aiCard').style.display = 'block';
    if (d.fg !== undefined && document.getElementById('fg').textContent.indexOf('…') >= 0)
      setFG(+d.fg, d.fgn);
  } catch(e){}
}

async function loadAll(){
  if (!WALLETS.length) { setStat('Кошельки не загружены'); return }
  if (currentKit===null) currentKit = 0;
  const w = WALLETS[currentKit];
  fills = []; poss = [];
  setStat('Загружаю ' + w.name + '…');
  try {
    const [f, st] = await Promise.allSettled([
      hl({type:'userFills', user:w.addr}),
      hl({type:'clearinghouseState', user:w.addr})
    ]);
    if (f.status==='fulfilled' && Array.isArray(f.value))
      for (const x of f.value){
        const px=+x.px||0, sz=+x.sz||0;
        fills.push({t:+x.time||0, coin:(x.coin||'').toUpperCase(),
                    dir:x.dir||'', px, val:px*sz, cp:+x.closedPnl||0});
      }
    if (st.status==='fulfilled' && st.value && Array.isArray(st.value.assetPositions))
      for (const ap of st.value.assetPositions){
        const p = ap.position||{}, s = +p.szi||0;
        if (!s) continue;
        poss.push({coin:(p.coin||'').toUpperCase(), side:s>0?'LONG':'SHORT',
                   value:+p.positionValue||0, entry:+p.entryPx||0,
                   liq:+p.liquidationPx||0,
                   lev:(p.leverage && p.leverage.value) || 1, upnl:+p.unrealizedPnl||0});
      }
  } catch(e){}
  fills = fills.filter(f=>!junkCoin(f.coin));
  poss = poss.filter(p=>!junkCoin(p.coin));
  fills.sort((a,b)=>b.t-a.t);
  if (!coin || !fills.some(f=>f.coin===coin) && !poss.some(p=>p.coin===coin)) coin = topCoin();
  renderPositions(); renderCoinPills(); renderTrades(); loadCandles();
  document.getElementById('upd') && (document.getElementById('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU'));
  const wr = WALLETS[currentKit].wr;
  setStat((wr!==undefined?`WR кита: ${wr}% · `:'') + 'сделок: ' + fills.length +
          ' | 🟢лонг 🔴шорт ⭕️тейк/стоп');
}

function topCoin(){
  const byVal = {}; poss.forEach(p=>byVal[p.coin]=(byVal[p.coin]||0)+p.value);
  const cs = Object.keys(byVal);
  if (!cs.length) return fills.length ? fills[0].coin : 'BTC';
  return cs.sort((a,b)=>byVal[b]-byVal[a])[0];
}

function renderCoinPills(){
  const set = [...new Set([...poss.map(p=>p.coin), ...fills.map(f=>f.coin)])].filter(Boolean).slice(0,24);
  if (coin && !set.includes(coin)) set.unshift(coin);
  const el = document.getElementById('coins'); el.innerHTML='';
  set.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'pill' + (c===coin ? ' on' : '');
    b.textContent = c;
    b.onclick = ()=>{ coin=c; renderCoinPills(); renderTrades(); loadCandles();
                      window.scrollTo({top:0, behavior:'smooth'}); };
    el.appendChild(b);
  });
}

function renderPositions(){
  const tb = document.querySelector('#posT tbody');
  if (!poss.length){ tb.innerHTML='<tr><td class="dim">Открытых позиций нет</td></tr>'; return }
  poss.sort((a,b)=>b.value-a.value);
  tb.innerHTML = '<tr><th>Монета</th><th>Сторона</th><th>Размер</th><th>Вход</th><th>Стоп (ликв.)</th><th>Плечо</th><th>PnL</th></tr>' +
    poss.slice(0,40).map(p=>
      '<tr class="click" onclick="pickCoin(\''+esc(p.coin)+'\')">' +
      '<td><b>'+esc(p.coin)+'</b></td>' +
      '<td><span class="badge '+(p.side==='LONG'?'L':'S')+'">'+p.side+'</span></td>' +
      '<td>'+fmtUsd(p.value)+'</td><td>'+fmtPx(p.entry)+'</td>' +
      '<td class="neg">'+(p.liq?fmtPx(p.liq):'—')+'</td><td class="dim">x'+p.lev+'</td>' +
      '<td class="'+(p.upnl>=0?'pos':'neg')+'">'+(p.upnl>=0?'+':'')+fmtUsd(p.upnl)+'</td></tr>').join('');
}
function pickCoin(c){ coin=c; renderCoinPills(); renderTrades(); loadCandles();
                      window.scrollTo({top:0, behavior:'smooth'}); }

// ==== метки сделок: ВХОД / ДОЛИВ / ТЕЙК / СТОП ====
function tradeLabels(list){        // list — сделки одной монеты, новые сверху
  const openState = {};            // была ли уже открытая позиция в эту сторону
  const lab = new Array(list.length);
  for (let i=list.length-1; i>=0; i--){
    const f = list[i], open = isOpen(f.dir), long = isLong(f.dir);
    const key = long ? 'L' : 'S';
    if (open){
      lab[i] = openState[key] ? 'ДОЛИВ ➕' : (long ? 'ВХОД 🟢' : 'ВХОД 🔴');
      openState[key] = true;
    } else {
      lab[i] = f.cp > 0 ? 'ТЕЙК ✅' : (f.cp < 0 ? 'СТОП ❌' : 'ЗАКРЫТО ⭕️');
      openState[key] = false;
    }
  }
  return lab;
}

function renderTrades(){
  const tb = document.querySelector('#trT tbody');
  const list = fills.filter(f=>f.coin===coin).slice(0,30);
  if (!list.length){ tb.innerHTML='<tr><td class="dim">Недавних сделок нет</td></tr>'; return }
  const lab = tradeLabels(list);
  tb.innerHTML = '<tr><th>Время</th><th>Действие</th><th>Цена</th><th>Объём</th><th>Результат</th></tr>' + list.map((f,i)=>{
    const cls = /ВХОД 🟢|ТЕЙК/.test(lab[i]) ? 'pos' : (/ВХОД 🔴|СТОП/.test(lab[i]) ? 'neg' : 'dim');
    let res = '';
    if (!isOpen(f.dir)) res = (f.cp>=0?'+':'')+fmtUsd(f.cp);
    return '<tr><td class="dim">'+when(f.t)+'</td>' +
           '<td class="'+cls+'"><b>'+lab[i]+'</b></td>' +
           '<td>'+fmtPx(f.px)+'</td><td>'+fmtUsd(f.val)+'</td>' +
           '<td class="'+(f.cp>0?'pos':(f.cp<0?'neg':'dim'))+'">'+res+'</td></tr>';
  }).join('');
}

function initChart(){
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#151a21'}, textColor:'#8b97a5'},
    grid:{vertLines:{color:'#1d232b'}, horzLines:{color:'#1d232b'}},
    rightPriceScale:{borderColor:'#232a33'},
    timeScale:{borderColor:'#232a33', timeVisible:true, secondsVisible:false},
    crosshair:{mode:0}});
  series = chart.addCandlestickSeries({upColor:'#26a69a', downColor:'#ef5350',
    borderVisible:false, wickUpColor:'#26a69a', wickDownColor:'#ef5350'});
  chart.applyOptions({width:el.clientWidth});
  new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth})).observe(el);
}

async function loadCandles(){
  if (!series) return;
  series.setData([]); series.setMarkers([]);
  if (!coin) { setStat('Выбери монету'); return }
  try{
    const days = tf==='15m' ? 3 : tf==='4h' ? 30 : 10;
    const cs = await hl({type:'candleSnapshot', req:{coin:coin, interval:tf,
                    startTime:Date.now()-days*864e5, endTime:Date.now()}});
    if (!Array.isArray(cs) || !cs.length){ setStat('Нет данных графика по '+coin); return }
    const last = +cs[cs.length-1].c;
    const pf = last>=1000 ? {precision:2,minMove:0.01}
             : last>=1    ? {precision:4,minMove:0.0001}
             :              {precision:8,minMove:1e-8};
    series.applyOptions({priceFormat:pf});
    series.setData(cs.map(c=>({time:Math.floor(c.t/1000), open:+c.o, high:+c.h, low:+c.l, close:+c.c})));
    const list = fills.filter(f=>f.coin===coin).slice(0,100);
    const lab = tradeLabels(list);
    const ms = list.map((f,i)=>{
      const open = isOpen(f.dir), long = isLong(f.dir);
      const add = lab[i].indexOf('ДОЛИВ')===0;
      return { time: Math.floor(f.t/1000),
               position: open ? (long?'belowBar':'aboveBar') : 'inBar',
               color: open ? (long?'#26a69a':'#ef5350') : '#9aa0a6',
               shape: open ? (add?'square':(long?'arrowUp':'arrowDown')) : 'circle',
               text: lab[i] + ' ' + fmtUsd(f.val) };
    }).sort((a,b)=>a.time-b.time);
    series.setMarkers(ms);
    chart.timeScale().fitContent();
  }catch(e){ setStat('Не удалось загрузить свечи по '+coin); }
}

function renderTf(){
  const el = document.getElementById('tfs'); el.innerHTML='';
  [['15m','15 мин'],['1h','1 час'],['4h','4 часа']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'pill' + (tf===v ? ' on' : '');
    b.textContent = label;
    b.onclick = ()=>{ tf=v; renderTf(); loadCandles(); };
    el.appendChild(b);
  });
}

try { initChart(); } catch(e){ setStat('Ошибка графика: '+e); }
renderTf();
loadFG(); loadInsight();
setInterval(loadFG, 300000);
(async ()=>{
  await loadWallets();
  applyWalletFilter();
  renderKitSelect();
  loadAll();
})();
setInterval(loadAll, 120000);
</script>
</body>
</html>
