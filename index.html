<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>🐋 Whale Radar — сделки китов Hyperliquid</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0b0e11;--card:#151a21;--line:#232a33;--txt:#e8edf2;--dim:#8b97a5;--up:#26a69a;--dn:#ef5350;--acc:#4da3ff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.45 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding-bottom:76px}
header{padding:12px 14px 4px;display:flex;justify-content:space-between;align-items:baseline}
header h1{font-size:17px}
#upd{color:var(--dim);font-size:11px}
.wrap{padding:0 10px}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.pill.on{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:700}
#chart{height:46vh;min-height:280px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:2px}
h2{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:14px 4px 8px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:8px 10px;border-bottom:1px solid var(--line);font-size:13px;text-align:left;white-space:nowrap}
th{color:var(--dim);font-weight:600;font-size:11px;text-transform:uppercase}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.L{background:rgba(38,166,154,.15);color:var(--up)}.S{background:rgba(239,83,80,.15);color:var(--dn)}
.pos{color:var(--up)}.neg{color:var(--dn)}.dim{color:var(--dim)}
.cta{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px;background:rgba(11,14,17,.94);border-top:1px solid var(--line)}
.cta a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:13px;padding:11px 6px;border-radius:10px}
.a1{background:linear-gradient(135deg,#2b6cff,#4da3ff);color:#fff}
.a2{background:linear-gradient(135deg,#c98a1b,#f0b429);color:#221a02}
#status{color:var(--dim);font-size:12px;padding:10px 4px;text-align:center;min-height:20px}
</style>
</head>
<body>
<header><h1>🐋 Whale Radar</h1><span id="upd">загрузка…</span></header>
<div class="wrap">
  <div id="coins" class="pills"></div>
  <div id="tfs" class="pills"></div>
  <div id="chart"></div>
  <p id="status"></p>
  <h2>Позиции китов</h2>
  <table id="posT"><tbody><tr><td class="dim">Загружаю китов…</td></tr></tbody></table>
  <h2>Сделки китов по выбранной монете</h2>
  <table id="trT"><tbody><tr><td class="dim">—</td></tr></tbody></table>
</div>
<div class="cta">
  <a class="a1" id="obA" href="#" target="_blank">🤖 Копировать OB-бота</a>
  <a class="a2" id="refA" href="#" target="_blank">💎 Бонус BingX</a>
</div>
<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setBackgroundColor('#0b0e11'); } catch(e){} }

// ==== подставляется ботом/вручную ====
const DEFAULT_WALLETS = [
  {addr:"0x393d0b87ed38fc779fd9611144ae649ba6082109", name:"Top Trader 1"},
  {addr:"0x488d2a9b70cc18ef66057a48ab3d59da1c59fe08", name:"Top Trader 2"},
  {addr:"0x4eb8d907136189a34c9b087950211b6a566f7819", name:"Top Trader 3"},
  {addr:"0x05cafe987297448f21a3c7ae0ae815fddecac655", name:"Top Trader 4"},
  {addr:"0x85530f0ff6496c72a619f37a60f3c1a59077737f", name:"Top Trader 5"},
  {addr:"0x1ab185be5ff61f7b678d6a871d439307cd0752e3", name:"Top Trader 6"},
  {addr:"0x082e843a431aef031264dc232693dd710aedca88", name:"Top Trader 7"}
];
const DEFAULT_REF = "https://bingx.com/invite/UKFNVC";
const DEFAULT_OB  = "https://general.bingx.com/2H4CTy";
// =====================================

const qs  = new URLSearchParams(location.search);
const REF = qs.get('ref') || DEFAULT_REF;
const OB  = qs.get('ob')  || DEFAULT_OB;
document.getElementById('obA').href  = OB;
document.getElementById('refA').href = REF;

const HL = 'https://api.hyperliquid.xyz/info';
async function hl(p){
  const r = await fetch(HL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(p)});
  if (!r.ok) throw new Error('http ' + r.status);
  return r.json();
}
const qsW = (qs.get('w')||'').split(',').filter(a=>/^0x[0-9a-fA-F]{40}$/.test(a)).slice(0,25);
const WALLETS = qsW.length ? qsW.map(a=>({addr:a.toLowerCase(), name:'Кит '+a.slice(2,6)+'…'})) : DEFAULT_WALLETS;

let fills = [], poss = [], coin = null, tf = '1h', chart = null, series = null;

const fmtUsd = v => { v=+v||0; const a=Math.abs(v);
  if (a>=1e9) return (v/1e9).toFixed(2)+'B$';
  if (a>=1e6) return (v/1e6).toFixed(2)+'M$';
  if (a>=1e3) return (v/1e3).toFixed(1)+'K$';
  return v.toFixed(0)+'$'; };
const fmtPx = p => { p=+p;
  if (p>=1000)  return p.toLocaleString('en-US',{maximumFractionDigits:2});
  if (p>=1)     return p.toFixed(4);
  if (p>=0.001) return p.toFixed(6);
  return p ? p.toPrecision(4) : '0'; };
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const when = t => new Date(t*1000).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const isLong = d => /Long/i.test(d||'');
const isOpen = d => /^Open/i.test(d||'');

function setStat(s){ document.getElementById('status').textContent = s || ''; }

async function loadAll(){
  fills = []; poss = [];
  for (let i=0; i<WALLETS.length; i++){
    const w = WALLETS[i];
    setStat('Загружаю китов ' + (i+1) + '/' + WALLETS.length + '…');
    try {
      const [f, st] = await Promise.allSettled([
        hl({type:'userFills', user:w.addr}),
        hl({type:'clearinghouseState', user:w.addr})
      ]);
      if (f.status==='fulfilled' && Array.isArray(f.value))
        for (const x of f.value){
          const px=+x.px||0, sz=+x.sz||0;
          fills.push({t:+x.time||0, name:w.name, coin:(x.coin||'').toUpperCase(),
                      dir:x.dir||'', px, val:px*sz});
        }
      if (st.status==='fulfilled' && st.value && Array.isArray(st.value.assetPositions))
        for (const ap of st.value.assetPositions){
          const p = ap.position||{}, s = +p.szi||0;
          if (!s) continue;
          poss.push({name:w.name, coin:(p.coin||'').toUpperCase(), side:s>0?'LONG':'SHORT',
                     value:+p.positionValue||0, entry:+p.entryPx||0,
                     lev:(p.leverage && p.leverage.value) || 1, upnl:+p.unrealizedPnl||0});
        }
    } catch(e){}
  }
  fills.sort((a,b)=>b.t-a.t);
  if (!coin) coin = topCoin();
  renderPositions(); renderCoinPills(); renderTrades(); loadCandles();
  document.getElementById('upd').textContent = 'обновлено ' + new Date().toLocaleTimeString('ru-RU');
  setStat('Стрелки на графике — входы китов: 🟢 лонг · 🔴 шорт · серый круг — закрытие');
}

function topCoin(){
  const byVal = {}; poss.forEach(p=>byVal[p.coin]=(byVal[p.coin]||0)+p.value);
  const cs = Object.keys(byVal);
  if (!cs.length) return fills.length ? fills[0].coin : 'BTC';
  return cs.sort((a,b)=>byVal[b]-byVal[a])[0];
}

function renderCoinPills(){
  const set = [...new Set([...poss.map(p=>p.coin), ...fills.map(f=>f.coin)])].filter(Boolean).slice(0,24);
  if (coin && !set.includes(coin)) set.unshift(coin);
  const el = document.getElementById('coins'); el.innerHTML='';
  set.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'pill' + (c===coin ? ' on' : '');
    b.textContent = c;
    b.onclick = ()=>{ coin=c; renderCoinPills(); renderTrades(); loadCandles();
                      window.scrollTo({top:0, behavior:'smooth'}); };
    el.appendChild(b);
  });
}

function renderPositions(){
  const tb = document.querySelector('#posT tbody');
  if (!poss.length){ tb.innerHTML='<tr><td class="dim">Открытых позиций у китов нет</td></tr>'; return }
  poss.sort((a,b)=>b.value-a.value);
  tb.innerHTML = '<tr><th>Кит</th><th>Монета</th><th>Сторона</th><th>Размер</th><th>Плечо</th><th>PnL</th></tr>' +
    poss.slice(0,40).map(p=>
      '<tr class="click" onclick="pickCoin(\''+esc(p.coin)+'\')">' +
      '<td>'+esc(p.name)+'</td><td><b>'+esc(p.coin)+'</b></td>' +
      '<td><span class="badge '+(p.side==='LONG'?'L':'S')+'">'+p.side+'</span></td>' +
      '<td>'+fmtUsd(p.value)+'</td><td class="dim">x'+p.lev+'</td>' +
      '<td class="'+(p.upnl>=0?'pos':'neg')+'">'+(p.upnl>=0?'+':'')+fmtUsd(p.upnl)+'</td></tr>').join('');
}
function pickCoin(c){ coin=c; renderCoinPills(); renderTrades(); loadCandles();
                      window.scrollTo({top:0, behavior:'smooth'}); }

function renderTrades(){
  const tb = document.querySelector('#trT tbody');
  const list = fills.filter(f=>f.coin===coin).slice(0,30);
  if (!list.length){ tb.innerHTML='<tr><td class="dim">Недавних сделок нет</td></tr>'; return }
  tb.innerHTML = list.map(f=>{
    const open = isOpen(f.dir), long = isLong(f.dir);
    const cls = open ? (long?'pos':'neg') : 'dim';
    const txt = open ? (long?'LONG':'SHORT') : 'закрытие';
    return '<tr><td class="dim">'+when(f.t)+'</td><td>'+esc(f.name)+'</td>' +
           '<td class="'+cls+'"><b>'+txt+'</b></td>' +
           '<td>'+fmtPx(f.px)+'</td><td>'+fmtUsd(f.val)+'</td></tr>';
  }).join('');
}

function initChart(){
  const el = document.getElementById('chart');
  chart = LightweightCharts.createChart(el, {
    layout:{background:{color:'#151a21'}, textColor:'#8b97a5'},
    grid:{vertLines:{color:'#1d232b'}, horzLines:{color:'#1d232b'}},
    rightPriceScale:{borderColor:'#232a33'},
    timeScale:{borderColor:'#232a33', timeVisible:true, secondsVisible:false},
    crosshair:{mode:0}});
  series = chart.addCandlestickSeries({upColor:'#26a69a', downColor:'#ef5350',
    borderVisible:false, wickUpColor:'#26a69a', wickDownColor:'#ef5350'});
  chart.applyOptions({width:el.clientWidth});
  new ResizeObserver(()=>chart.applyOptions({width:el.clientWidth})).observe(el);
}

async function loadCandles(){
  if (!series) return;
  series.setData([]); series.setMarkers([]);
  try{
    const days = tf==='15m' ? 2 : tf==='4h' ? 21 : 7;
    const cs = await hl({type:'candleSnapshot', req:{coin:coin, interval:tf,
                    startTime:Date.now()-days*864e5, endTime:Date.now()}});
    if (!Array.isArray(cs) || !cs.length){ setStat('Нет данных графика по '+coin); return }
    const last = +cs[cs.length-1].c;
    const pf = last>=1000 ? {precision:2,minMove:0.01}
             : last>=1    ? {precision:4,minMove:0.0001}
             :              {precision:8,minMove:1e-8};
    series.applyOptions({priceFormat:pf});
    series.setData(cs.map(c=>({time:Math.floor(c.t/1000), open:+c.o, high:+c.h, low:+c.l, close:+c.c})));
    const marks = fills.filter(f=>f.coin===coin).slice(0,80).map(f=>{
      const open = isOpen(f.dir), long = isLong(f.dir);
      return { time: Math.floor(f.t/1000),
               position: open ? (long?'belowBar':'aboveBar') : 'inBar',
               color: open ? (long?'#26a69a':'#ef5350') : '#9aa0a6',
               shape: open ? (long?'arrowUp':'arrowDown') : 'circle',
               text: (open ? (long?'🟢L ':'🔴S ') : '⭕ ') + fmtUsd(f.val) };
    }).sort((a,b)=>a.time-b.time);
    series.setMarkers(marks);
    chart.timeScale().fitContent();
  }catch(e){ setStat('Не удалось загрузить свечи по '+coin); }
}

function renderTf(){
  const el = document.getElementById('tfs'); el.innerHTML='';
  [['15m','15 минут'],['1h','1 час'],['4h','4 часа']].forEach(([v,label])=>{
    const b = document.createElement('button');
    b.className = 'pill' + (tf===v ? ' on' : '');
    b.textContent = label;
    b.onclick = ()=>{ tf=v; renderTf(); loadCandles(); };
    el.appendChild(b);
  });
}

try { initChart(); } catch(e){ setStat('Ошибка графика: '+e); }
renderTf();
loadAll();
setInterval(loadAll, 120000);
</script>
</body>
</html>
